services:
  # Django Web Service
  - type: web
    name: recruitment-platform
    env: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn recruitment_platform.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: recruitment-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: recruitment-redis
          property: connectionString

databases:
  # PostgreSQL Database
  - name: recruitment-db
    databaseName: recruitment_platform
    user: recruitment_user
    region: oregon

  # Redis for Celery
  - name: recruitment-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
